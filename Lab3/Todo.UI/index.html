<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Todo App</title>
<style>
:root{--muted:#9aa5b1;--accent:#6ee7b7}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial;background:linear-gradient(180deg,#071024 0%,#071b2a 100%);color:#e6eef6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{width:100%;max-width:720px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
header h1{margin:0;font-size:1.6rem}
.card{background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.01));padding:18px;border-radius:12px;box-shadow:0 6px 18px rgba(2,6,23,.6)}
.input-row{display:flex;gap:8px}
.input-row input[type=text]{flex:1;padding:12px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.04);background:transparent;color:inherit;font-size:1rem}
.input-row button{padding:10px 14px;border-radius:8px;border:none;background:var(--accent);color:#042023;font-weight:600;cursor:pointer}
.controls{display:flex;justify-content:space-between;align-items:center;margin-top:12px;flex-wrap:wrap;gap:8px}
.filters{display:flex;gap:8px}
.filters button{background:transparent;border:1px solid rgba(255,255,255,.04);padding:8px 10px;border-radius:8px;color:var(--muted);cursor:pointer}
.filters button.active{border-color:var(--accent);color:var(--accent);font-weight:600}
ul.todo-list{list-style:none;padding:0;margin:14px 0 0;max-height:60vh;overflow:auto}
li.todo{display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,.02);margin-bottom:8px}
.todo .title{flex:1;word-break:break-word}
.todo.completed .title{text-decoration:line-through;opacity:.6}
.todo .actions{display:flex;gap:8px}
.icon-btn{background:transparent;border:1px solid rgba(255,255,255,.03);padding:6px;border-radius:8px;cursor:pointer;color:inherit}
.small{font-size:.9rem;color:var(--muted)}
.empty{padding:20px;text-align:center;color:var(--muted)}
@media (max-width:480px){header h1{font-size:1.2rem}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Todo List</h1></header>
  <section class="card">
    <div class="input-row">
      <input id="todo-input" type="text" maxlength="50" placeholder="Thêm việc... (nhấn Enter để lưu)" />
      <button id="add-btn">Thêm</button>
    </div>
    <div class="controls">
      <div class="filters" role="tablist">
        <button data-filter="all" class="active">Tất cả</button>
        <button data-filter="active">Chưa xong</button>
        <button data-filter="completed">Đã xong</button>
      </div>
      <div class="right-actions">
        <span class="small" id="count">0 việc</span>
        <button id="clear-completed" class="icon-btn" title="Xóa đã hoàn thành">X</button>
      </div>
    </div>
    <ul id="list" class="todo-list" aria-live="polite"></ul>
    <div id="empty" class="empty" hidden>Không có công việc. Thêm việc mới ở trên.</div>
    <div id="status" class="small" style="margin-top:8px"></div>
  </section>
</div>

<script>
// !!! Đổi port cho đúng với port của Todo.API khi chạy (xem Properties/launchSettings.json)
const API_BASE = 'https://localhost:7208/api/v1/todos';
const KEY = 'todos_v1';

const input = document.getElementById('todo-input');
const addBtn = document.getElementById('add-btn');
const listEl = document.getElementById('list');
const countEl = document.getElementById('count');
const emptyEl = document.getElementById('empty');
const clearBtn = document.getElementById('clear-completed');
const filters = document.querySelectorAll('.filters button');
const statusEl = document.getElementById('status');

let todos = [];          // { id, text, completed }
let filter = 'all';
let usingAPI = true;

function setStatus(msg){ statusEl.textContent = msg || ''; }
function save(){ localStorage.setItem(KEY, JSON.stringify(todos)); }
function uid(){ return 'local-' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

// API (title/isCompleted)  <->  UI (text/completed)
const fromApi = t => ({ id: String(t.id), text: t.title ?? '', completed: !!t.isCompleted });
const toApi = t => ({ title: t.text, isCompleted: !!t.completed });

// ---------- gọi API ----------
async function fetchFromApi(){
  try{
    setStatus('Đang tải dữ liệu từ API...');
    const res = await fetch(API_BASE, { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if(!Array.isArray(data)) throw new Error('Invalid data');
    todos = data.map(fromApi);
    usingAPI = true;
    setStatus('Đồng bộ với API.');
  }catch(err){
    console.warn('API fetch failed:', err);
    usingAPI = false;
    setStatus('Không thể kết nối API — sử dụng dữ liệu cục bộ.');
    todos = JSON.parse(localStorage.getItem(KEY) || '[]');
  }
  render();
}

function apiFail(op, err){
  console.warn(op + ' failed', err);
  usingAPI = false;
  setStatus('API lỗi — chuyển sang chế độ cục bộ.');
}

async function apiCreate(todo){              // POST
  try{
    const res = await fetch(API_BASE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(toApi(todo))
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return fromApi(await res.json());
  }catch(err){ apiFail('create', err); return null; }
}

async function apiUpdate(id, todo){          // PUT
  try{
    const res = await fetch(API_BASE + '/' + encodeURIComponent(id), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(toApi(todo))
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return fromApi(await res.json());
  }catch(err){ apiFail('update', err); return null; }
}

async function apiDelete(id){                // DELETE
  try{
    const res = await fetch(API_BASE + '/' + encodeURIComponent(id), { method: 'DELETE' });
    if(!(res.ok || res.status === 204)) throw new Error('HTTP ' + res.status);
    return true;
  }catch(err){ apiFail('delete', err); return false; }
}

// ---------- hiển thị ----------
function render(){
  const visible = todos.filter(t =>
    filter === 'all' ? true : filter === 'active' ? !t.completed : t.completed);

  listEl.innerHTML = '';
  emptyEl.hidden = visible.length > 0;

  visible.forEach(t => {
    const li = document.createElement('li');
    li.className = 'todo' + (t.completed ? ' completed' : '');

    const chk = document.createElement('input');
    chk.type = 'checkbox';
    chk.checked = !!t.completed;
    chk.addEventListener('change', () => toggle(t.id));

    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = t.text;
    title.contentEditable = true;
    title.spellcheck = false;
    title.addEventListener('blur', () => {
      const v = title.textContent.trim();
      if(v !== t.text) edit(t.id, v);
    });
    title.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); title.blur(); } });

    const actions = document.createElement('div');
    actions.className = 'actions';
    const del = document.createElement('button');
    del.className = 'icon-btn';
    del.title = 'Xóa';
    del.textContent = '🗑';
    del.addEventListener('click', () => remove(t.id));
    actions.appendChild(del);

    li.append(chk, title, actions);
    listEl.appendChild(li);
  });

  countEl.textContent = todos.filter(t => !t.completed).length + ' việc';
  save();
}

// ---------- thao tác ----------
async function add(text){
  const txt = (text || '').trim().slice(0, 50);
  if(!txt) return;
  const newTodo = { text: txt, completed: false };

  if(usingAPI){
    const created = await apiCreate(newTodo);
    if(created){ todos.push(created); input.value = ''; render(); return; }
  }
  todos.push({ id: uid(), ...newTodo });
  input.value = '';
  render();
}

function replaceTodo(id, updated){
  todos = todos.map(x => x.id === id ? updated : x);
  render();
}

async function toggle(id){
  const t = todos.find(x => x.id === id); if(!t) return;
  const updated = { ...t, completed: !t.completed };

  if(usingAPI && !id.startsWith('local-')){
    const res = await apiUpdate(id, updated);
    if(res){ replaceTodo(id, res); return; }
  }
  replaceTodo(id, updated);
}

async function edit(id, newText){
  if(newText === ''){ remove(id); return; }
  const t = todos.find(x => x.id === id); if(!t) return;
  const updated = { ...t, text: newText.slice(0, 50) };

  if(usingAPI && !id.startsWith('local-')){
    const res = await apiUpdate(id, updated);
    if(res){ replaceTodo(id, res); return; }
  }
  replaceTodo(id, updated);
}

async function remove(id){
  if(usingAPI && !id.startsWith('local-')){
    const ok = await apiDelete(id);
    if(!ok){ render(); return; }   // lỗi API -> giữ nguyên danh sách
  }
  todos = todos.filter(t => t.id !== id);
  render();
}

async function clearCompleted(){
  const completed = todos.filter(t => t.completed);
  if(usingAPI){
    for(const t of completed){ await apiDelete(t.id); }
    if(usingAPI){ await fetchFromApi(); return; }
  }
  todos = todos.filter(t => !t.completed);
  render();
}

// ---------- sự kiện ----------
addBtn.addEventListener('click', () => add(input.value));
input.addEventListener('keydown', e => { if(e.key === 'Enter') add(input.value); });
clearBtn.addEventListener('click', clearCompleted);
filters.forEach(b => b.addEventListener('click', () => {
  filters.forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  filter = b.dataset.filter;
  render();
}));

fetchFromApi();
</script>
</body>
</html>
